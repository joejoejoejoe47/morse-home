<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morse Home</title>
    <meta
      name="description"
      content="The front door of Morse Chess. Sit down, pull up a game, and play."
    />
    <link rel="icon" href="/coin.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@340;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <img class="mark" src="/mark.png" alt="Morse Studios" />
      <p class="eyebrow">Morse Studios</p>
      <h1>Morse Chess</h1>
      <p class="lede">A private club board. Challenge by name, or take a random pull-up.</p>
      <a class="enter" href="https://morse-chess.vercel.app">Enter the club</a>
      <ul>
        <li>Boards you can buy and keep</li>
        <li>Timed games and breeze games</li>
        <li>A score that starts at 1200</li>
      </ul>
    </main>
    <footer>
      <img src="/coin.png" alt="" />
      <span>morse-chess.vercel.app</span>
    </footer>
  </body>
</html>
